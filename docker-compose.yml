services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      target: server
    ports:
      - "18000:18000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: scheduler
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
