services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: halostory-worker:latest
    pull_policy: never
    container_name: halostory-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST must be set to VPS 1 IP}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-halostory}
      DB_USERNAME: ${DB_USERNAME:-halostory}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set to VPS 1 IP}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-30}
      TZ: Asia/Jakarta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - worker-network

networks:
  worker-network:
    driver: bridge
