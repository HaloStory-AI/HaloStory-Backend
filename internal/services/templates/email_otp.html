<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ed;
        }
        .header {
            background-color: #b8d8f8;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .content {
            padding: 40px 30px;
            text-align: center;
        }
        .content p {
            font-size: 16px;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 25px;
        }
        .otp-box {
            background-color: #f0f5ff;
            border: 2px dashed #135acf;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            display: inline-block;
        }
        .otp-code {
            font-size: 36px;
            font-weight: bold;
            color: #135acf;
            letter-spacing: 5px;
            margin: 0;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #edf2f7;
        }
        .warning {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{.AppName}}</h1>
        </div>
        <div class="content">
            <h2 style="color: #135acf; margin-top: 0;">{{.Title}}</h2>
            <p>Hello Sensei!</p>
            <p>{{.Body}}</p>
            <div class="otp-box">
                <p style="margin-top: 0; font-size: 14px; color: #718096; text-transform: uppercase; font-weight: bold;">Verification Code</p>
                <h2 class="otp-code">{{.OTP}}</h2>
            </div>
            <p class="warning">
                This code is valid for <strong>15 minutes</strong>.<br>
                If you did not request this code, please ignore this email.
            </p>
        </div>
        <div class="footer">
            <p>&copy; 2026 R8KStudio. All rights reserved.</p>
            <p>Made with ❤️ by Sensei for Sensei.</p>
        </div>
    </div>
</body>
</html>
