<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — HaloStory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { background: #0f0f23; }
  .sidebar { width: 240px; }
  .sidebar a.active { background: rgba(168,85,247,0.2); border-color: #a855f7; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); }
  .card-sm { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
  .input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; }
  .input:focus { border-color: #a855f7; outline: none; ring: 1px solid #a855f7; }
  .scrollbar-thin::-webkit-scrollbar { width: 4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  table { width: 100%; }
  th { text-align: left; padding: 10px 12px; color: #9ca3af; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.1); }
  td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  tr:hover { background: rgba(255,255,255,0.03); }
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: all 0.15s; cursor: pointer; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
  .avatar { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.1); }
  .avatar-sm { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,0.1); }
  .pulse-bg { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
</style>
</head>
<body class="text-gray-200 min-h-screen flex">

<!-- Sidebar -->
<aside class="sidebar fixed left-0 top-0 h-full bg-[#0a0a1a] border-r border-white/10 overflow-y-auto scrollbar-thin z-30">
  <div class="p-4 border-b border-white/10">
    <h1 class="text-lg font-bold text-white"><i class="fa-solid fa-feather mr-2 text-purple-400"></i>HaloStory</h1>
    <p class="text-xs text-gray-500">Admin Panel</p>
  </div>
  <nav class="p-2 space-y-1">
    <a href="/admin/dashboard" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-chart-pie w-5 text-center"></i>Dashboard</a>
    <a href="/admin/bots" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-robot w-5 text-center"></i>Karakter</a>
    <a href="/admin/categories" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-tags w-5 text-center"></i>Kategori</a>
    <a href="/admin/users" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-users w-5 text-center"></i>Pengguna</a>
    <a href="/admin/requests" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-envelope w-5 text-center"></i>Request Murid</a>
    <a href="/admin/settings" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-gear w-5 text-center"></i>Pengaturan</a>
    <a href="/admin/byok" class="sidebar-nav flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-all border-l-2 border-transparent"><i class="fa-solid fa-key w-5 text-center"></i>BYOK Tester</a>
    <hr class="border-white/10 my-2">
    <a href="#" onclick="handleLogout()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all"><i class="fa-solid fa-right-from-bracket w-5 text-center"></i>Keluar</a>
  </nav>
</aside>

<!-- Main Content -->
<div class="ml-[240px] flex-1 p-6 min-h-screen" id="mainContent">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-white" id="pageTitle">Dashboard</h2>
    <div class="flex items-center gap-3">
      <span class="text-sm text-gray-400" id="userBadge"></span>
      <a href="/admin/login" onclick="handleLogout()" class="text-sm text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket mr-1"></i>Keluar</a>
    </div>
  </div>
  <div id="pageContent"></div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast hidden"></div>

<script>
// ─── Auth ───
const TOKEN = sessionStorage.getItem('admin_token');
const ADMIN_USER = JSON.parse(sessionStorage.getItem('admin_user') || '{}');

function requireAuth() {
  if (!TOKEN) { window.location.href = '/admin/login'; return false; }
  return true;
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401 || res.status === 403) {
    sessionStorage.clear();
    window.location.href = '/admin/login';
    return null;
  }
  const text = await res.text();
  try { return { status: res.status, data: text ? JSON.parse(text) : null }; }
  catch { return { status: res.status, data: text }; }
}

function handleLogout() {
  sessionStorage.clear();
  window.location.href = '/admin/login';
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = 'toast px-4 py-3 rounded-lg text-sm font-medium shadow-lg ' + (type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

// ─── Router ───
function getPage() {
  const path = window.location.pathname.replace(/^\/admin\/?/, '').split('/')[0] || 'dashboard';
  return path;
}

function showPage(page) {
  document.querySelectorAll('.sidebar-nav').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '/admin/' + page);
  });
  const titles = { dashboard:'Dashboard', bots:'Karakter', categories:'Kategori', users:'Pengguna', requests:'Request Murid', settings:'Pengaturan', byok:'BYOK Tester' };
  document.getElementById('pageTitle').textContent = titles[page] || 'Dashboard';
  document.getElementById('userBadge').innerHTML = ADMIN_USER.name ? '<i class="fa-regular fa-circle-user mr-1"></i>' + ADMIN_USER.name : '';

  if (!requireAuth() && page !== 'login') return;
  const loaders = { dashboard:loadDashboard, bots:loadBots, categories:loadCategories, users:loadUsers, requests:loadRequests, settings:loadSettings, byok:loadBYOK };
  if (loaders[page]) loaders[page]();
}

// ─── Dashboard ───
async function loadDashboard() {
  const el = document.getElementById('pageContent');
  el.innerHTML = '<div class="text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">Memuat dashboard...</p></div>';
  const res = await api('/api/admin/stats');
  if (!res) return;
  el.innerHTML = `
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="card rounded-xl p-4"><p class="text-gray-400 text-sm">Total Pengguna</p><p class="text-2xl font-bold text-white mt-1" id="stat-total_users">0</p></div>
      <div class="card rounded-xl p-4"><p class="text-gray-400 text-sm">Aktif Hari Ini</p><p class="text-2xl font-bold text-white mt-1" id="stat-active_today">0</p></div>
      <div class="card rounded-xl p-4"><p class="text-gray-400 text-sm">Aktif Minggu Ini</p><p class="text-2xl font-bold text-white mt-1" id="stat-active_week">0</p></div>
      <div class="card rounded-xl p-4"><p class="text-gray-400 text-sm">Aktif Bulan Ini</p><p class="text-2xl font-bold text-white mt-1" id="stat-active_month">0</p></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card rounded-xl p-4"><h3 class="text-sm font-medium text-gray-300 mb-3">Aktivitas per Jam (24 Jam)</h3><canvas id="chart-hourly" height="150"></canvas></div>
      <div class="card rounded-xl p-4"><h3 class="text-sm font-medium text-gray-300 mb-3">Aktivitas per Hari (7 Hari)</h3><canvas id="chart-daily" height="150"></canvas></div>
      <div class="card rounded-xl p-4"><h3 class="text-sm font-medium text-gray-300 mb-3">Aktivitas per Minggu (4 Minggu)</h3><canvas id="chart-weekly" height="150"></canvas></div>
      <div class="card rounded-xl p-4"><h3 class="text-sm font-medium text-gray-300 mb-3">Aktivitas per Bulan (12 Bulan)</h3><canvas id="chart-monthly" height="150"></canvas></div>
    </div>
  `;
  const s = res.data;
  document.getElementById('stat-total_users').textContent = s.total_users || 0;
  document.getElementById('stat-active_today').textContent = s.active_today || 0;
  document.getElementById('stat-active_week').textContent = s.active_week || 0;
  document.getElementById('stat-active_month').textContent = s.active_month || 0;

  const colors = { border:'rgba(168,85,247,0.8)', bg:'rgba(168,85,247,0.2)' };
  const chartOpts = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#9ca3af'}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#9ca3af'}}} };
  new Chart(document.getElementById('chart-hourly'), { type:'bar', data:{ labels:s.hourly_labels||[], datasets:[{data:s.hourly_values||[], backgroundColor:colors.bg, borderColor:colors.border, borderWidth:1 }] }, options:chartOpts });
  new Chart(document.getElementById('chart-daily'), { type:'bar', data:{ labels:s.daily_labels||[], datasets:[{data:s.daily_values||[], backgroundColor:colors.bg, borderColor:colors.border, borderWidth:1 }] }, options:chartOpts });
  new Chart(document.getElementById('chart-weekly'), { type:'doughnut', data:{ labels:s.weekly_labels||[], datasets:[{data:s.weekly_values||[], backgroundColor:['#a855f7','#3b82f6','#10b981','#f59e0b','#ef4444']}] }, options:{ responsive:true, plugins:{legend:{labels:{color:'#9ca3af',font:{size:12}}}} } });
  new Chart(document.getElementById('chart-monthly'), { type:'line', data:{ labels:s.monthly_labels||[], datasets:[{data:s.monthly_values||[], borderColor:colors.border, backgroundColor:colors.bg, fill:true, tension:0.3 }] }, options:chartOpts });
}

// ─── Bots ───
let botsData = [];

async function loadBots() {
  const el = document.getElementById('pageContent');
  el.innerHTML = '<div class="text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">Memuat data...</p></div>';
  const res = await api('/api/admin/bots');
  if (!res) return;
  botsData = res.data || [];
  const cats = [...new Set(botsData.map(b => b.category_slug).filter(Boolean))].sort();
  let html = `
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="showBotForm()" class="btn bg-purple-600 hover:bg-purple-700 text-white"><i class="fa-solid fa-plus mr-1"></i>Tambah Karakter</button>
      <button onclick="document.getElementById('importModal').classList.remove('hidden')" class="btn bg-blue-600 hover:bg-blue-700 text-white"><i class="fa-solid fa-upload mr-1"></i>Import CSV</button>
      <button onclick="document.getElementById('bulkModal').classList.remove('hidden')" class="btn bg-amber-600 hover:bg-amber-700 text-white"><i class="fa-solid fa-layer-group mr-1"></i>Bulk Assign</button>
    </div>
    <div id="bulkAssignBar" class="fixed bottom-0 left-[240px] right-0 bg-[#1a1a3e] border-t border-white/10 p-3 hidden z-40">
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-300" id="bulkCount">0 terpilih</span>
        <select id="bulkCategory" class="input rounded-lg px-3 py-1.5 text-sm">
          <option value="">Pilih kategori...</option>
          ${cats.map(c => '<option value="'+c+'">'+c+'</option>').join('')}
        </select>
        <button onclick="bulkAssign()" class="btn bg-purple-600 hover:bg-purple-700 text-white text-sm">Pindahkan</button>
        <button onclick="clearBulkSelection()" class="btn bg-white/10 hover:bg-white/20 text-white text-sm">Batal</button>
      </div>
    </div>
    <div class="card rounded-xl overflow-hidden">
      <table>
        <thead><tr>
          <th style="width:32px"><input type="checkbox" onchange="selectAllBots(this.checked)" class="accent-purple-500"></th>
          <th>Avatar</th><th>Bot ID</th><th>Nama</th><th>Kategori</th><th>Birthday</th><th>Aksi</th>
        </tr></thead>
        <tbody id="botsTbody"></tbody>
      </table>
    </div>
    <!-- Import Modal -->
    <div id="importModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
      <div class="card rounded-xl p-6 w-full max-w-lg">
        <h3 class="text-lg font-semibold text-white mb-4">Import Karakter</h3>
        <p class="text-sm text-gray-400 mb-4">Format: CSV (bot_id,name,description,category_slug,sbr,birthday,color,avatar) atau JSON array.</p>
        <input type="file" id="importFile" accept=".csv,.json" class="input rounded-lg w-full px-3 py-2 text-sm mb-4 file:bg-purple-600 file:text-white file:border-0 file:rounded file:px-3 file:py-1 file:mr-2 file:cursor-pointer">
        <div class="flex gap-2 justify-end">
          <button onclick="document.getElementById('importModal').classList.add('hidden')" class="btn bg-white/10 hover:bg-white/20 text-white">Batal</button>
          <button onclick="doImport()" class="btn bg-purple-600 hover:bg-purple-700 text-white">Import</button>
        </div>
      </div>
    </div>
    <!-- Bulk Modal -->
    <div id="bulkModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
      <div class="card rounded-xl p-6 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
        <h3 class="text-lg font-semibold text-white mb-2">Bulk Add Karakter</h3>
        <p class="text-sm text-gray-400 mb-4">Tambah beberapa karakter sekaligus.</p>
        <div id="bulkEntries"></div>
        <button onclick="addBulkEntry()" class="btn bg-white/10 hover:bg-white/20 text-white text-sm mb-4"><i class="fa-solid fa-plus mr-1"></i>Tambah Entry</button>
        <div class="flex gap-2 justify-end">
          <button onclick="document.getElementById('bulkModal').classList.add('hidden')" class="btn bg-white/10 hover:bg-white/20 text-white">Batal</button>
          <button onclick="doBulkStore()" class="btn bg-purple-600 hover:bg-purple-700 text-white">Simpan Semua</button>
        </div>
      </div>
    </div>
    <!-- Bot Form Modal -->
    <div id="botFormModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
      <div class="card rounded-xl p-6 w-full max-w-2xl max-h-[85vh] overflow-y-auto">
        <h3 class="text-lg font-semibold text-white mb-4" id="botFormTitle">Tambah Karakter</h3>
        <form id="botForm" class="space-y-3" onsubmit="return saveBot(event)">
          <input type="hidden" id="botFormEditId">
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs text-gray-400 mb-1">Bot ID</label><input id="botFormBotID" class="input rounded-lg w-full px-3 py-2 text-sm" required></div>
            <div><label class="block text-xs text-gray-400 mb-1">Nama</label><input id="botFormName" class="input rounded-lg w-full px-3 py-2 text-sm" required></div>
            <div><label class="block text-xs text-gray-400 mb-1">Kategori</label><select id="botFormCategory" class="input rounded-lg w-full px-3 py-2 text-sm"></select></div>
            <div class="flex gap-2"><div class="flex-1"><label class="block text-xs text-gray-400 mb-1">SBR</label><select id="botFormSBR" class="input rounded-lg w-full px-3 py-2 text-sm"><option value="">None</option><option value="PG">PG</option><option value="PG-13">PG-13</option><option value="R">R</option></select></div><div class="flex-1"><label class="block text-xs text-gray-400 mb-1">Color</label><input id="botFormColor" type="color" class="input rounded-lg w-full px-1 py-2 text-sm h-[38px]"></div></div>
            <div><label class="block text-xs text-gray-400 mb-1">Birthday</label><input id="botFormBirthday" type="date" class="input rounded-lg w-full px-3 py-2 text-sm"></div>
            <div class="flex items-center gap-2 pt-6"><label class="flex items-center gap-2 cursor-pointer"><input id="botFormChild" type="checkbox" class="accent-purple-500"><span class="text-sm text-gray-300">Child Safe</span></label></div>
          </div>
          <div><label class="block text-xs text-gray-400 mb-1">Avatar URL</label><input id="botFormAvatar" class="input rounded-lg w-full px-3 py-2 text-sm" placeholder="https://..."></div>
          <div><label class="block text-xs text-gray-400 mb-1">Deskripsi</label><textarea id="botFormDescription" rows="2" class="input rounded-lg w-full px-3 py-2 text-sm"></textarea></div>
          <div><label class="block text-xs text-gray-400 mb-1">Jailbreak</label><textarea id="botFormJailbreak" rows="2" class="input rounded-lg w-full px-3 py-2 text-sm"></textarea></div>
          <div><label class="block text-xs text-gray-400 mb-1">Personality</label><textarea id="botFormPersonality" rows="2" class="input rounded-lg w-full px-3 py-2 text-sm"></textarea></div>
          <div><label class="block text-xs text-gray-400 mb-1">Chat Examples</label><textarea id="botFormChatExamples" rows="2" class="input rounded-lg w-full px-3 py-2 text-sm" placeholder="S: ... | A: ... || ..."></textarea></div>
          <div class="flex gap-2 justify-end">
            <button type="button" onclick="document.getElementById('botFormModal').classList.add('hidden')" class="btn bg-white/10 hover:bg-white/20 text-white">Batal</button>
            <button type="submit" class="btn bg-purple-600 hover:bg-purple-700 text-white">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  `;
  el.innerHTML = html;
  renderBotsTable();
}

function renderBotsTable() {
  const tbody = document.getElementById('botsTbody');
  if (!tbody) return;
  const cats = [...new Set(botsData.map(b => b.category_slug).filter(Boolean))].sort();
  let html = '';
  cats.forEach(cat => {
    const items = botsData.filter(b => b.category_slug === cat);
    html += '<tr class="bg-white/5"><td colspan="7" class="text-sm font-semibold text-purple-300">' + cat + '</td></tr>';
    items.forEach(b => {
      html += '<tr><td><input type="checkbox" class="bot-cb accent-purple-500" value="'+b.bot_id+'" onchange="updateBulkBar()"></td><td>'+(b.avatar?'<img src="'+b.avatar+'" class="avatar" onerror="this.style.display=\'none\'">':'<div class="avatar flex items-center justify-center bg-purple-600/30"><i class="fa-solid fa-robot text-purple-400 text-xs"></i></div>')+'</td><td class="text-sm font-mono text-purple-300">'+b.bot_id+'</td><td class="text-sm">'+b.name+(b.child?' <span class="badge bg-green-600/20 text-green-400">CHILD</span>':'')+'</td><td class="text-sm text-gray-400">'+ (b.category_slug||'-') +'</td><td class="text-sm text-gray-400">'+(b.birthday||'-')+'</td><td class="text-sm"><button onclick="editBot(\''+b.bot_id+'\')" class="btn-sm bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 mr-1"><i class="fa-solid fa-pen"></i></button><button onclick="deleteBot(\''+b.bot_id+'\')" class="btn-sm bg-red-600/20 text-red-400 hover:bg-red-600/30"><i class="fa-solid fa-trash"></i></button></td></tr>';
    });
  });
  if (!cats.length) {
    botsData.forEach(b => {
      html += '<tr><td><input type="checkbox" class="bot-cb accent-purple-500" value="'+b.bot_id+'" onchange="updateBulkBar()"></td><td>'+(b.avatar?'<img src="'+b.avatar+'" class="avatar">':'<div class="avatar flex items-center justify-center bg-purple-600/30"><i class="fa-solid fa-robot text-purple-400 text-xs"></i></div>')+'</td><td class="text-sm font-mono text-purple-300">'+b.bot_id+'</td><td class="text-sm">'+b.name+(b.child?' <span class="badge bg-green-600/20 text-green-400">CHILD</span>':'')+'</td><td class="text-sm text-gray-400">-</td><td class="text-sm text-gray-400">'+(b.birthday||'-')+'</td><td class="text-sm"><button onclick="editBot(\''+b.bot_id+'\')" class="btn-sm bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 mr-1"><i class="fa-solid fa-pen"></i></button><button onclick="deleteBot(\''+b.bot_id+'\')" class="btn-sm bg-red-600/20 text-red-400 hover:bg-red-600/30"><i class="fa-solid fa-trash"></i></button></td></tr>';
    });
  }
  tbody.innerHTML = html;
}

function selectAllBots(checked) {
  document.querySelectorAll('.bot-cb').forEach(cb => cb.checked = checked);
  updateBulkBar();
}

function updateBulkBar() {
  const checked = document.querySelectorAll('.bot-cb:checked').length;
  const bar = document.getElementById('bulkAssignBar');
  if (checked > 0) { bar.classList.remove('hidden'); document.getElementById('bulkCount').textContent = checked + ' terpilih'; }
  else bar.classList.add('hidden');
}

function clearBulkSelection() {
  document.querySelectorAll('.bot-cb').forEach(cb => cb.checked = false);
  updateBulkBar();
}

async function bulkAssign() {
  const cat = document.getElementById('bulkCategory').value;
  if (!cat) { toast('Pilih kategori dulu', 'error'); return; }
  const selected = [...document.querySelectorAll('.bot-cb:checked')].map(cb => cb.value);
  const res = await api('/api/admin/bulk-assign-category', { method:'POST', body:JSON.stringify({ selected_bots:selected, category_slug:cat }) });
  if (res && res.status < 400) { toast('Berhasil dipindahkan'); loadBots(); }
  else toast('Gagal', 'error');
}

function showBotForm(data) {

function renderUsers(users) {
  const tbody = document.getElementById('usersTbody');
  if (!tbody) return;
  const page = parseInt(new URLSearchParams(window.location.search).get('page') || '1');
  const perPage = 25;
  const start = (page - 1) * perPage;
  const paged = users.slice(start, start + perPage);
  tbody.innerHTML = paged.map(u => '<tr><td class="text-sm font-medium">'+(u.name||'<span class="text-gray-500">—</span>')+'</td><td class="text-sm text-gray-400">'+u.email+'</td><td><span class="badge '+(u.role==='admin'?'bg-purple-600/20 text-purple-400':u.role==='vip'?'bg-amber-600/20 text-amber-400':'bg-gray-600/20 text-gray-400')+'">'+(u.role||'user')+'</span></td><td class="text-sm">'+(u.vip_expires_at ? new Date(u.vip_expires_at).toLocaleDateString() : '<span class="text-gray-500">—</span>')+'</td><td class="text-sm">'+(u.is_banned ? '<span class="badge bg-red-600/20 text-red-400">Banned'+(u.ban_reason ? ': '+u.ban_reason : '')+'</span>' : '<span class="text-gray-500">—</span>')+'</td><td class="text-sm text-gray-400">'+new Date(u.created_at).toLocaleDateString()+'</td><td class="text-sm whitespace-nowrap"><button onclick="openVipModal('+u.id+')" class="btn-sm bg-amber-600/20 text-amber-400 hover:bg-amber-600/30 mr-1"><i class="fa-solid fa-crown"></i></button><button onclick="openBanModal('+u.id+')" class="btn-sm bg-red-600/20 text-red-400 hover:bg-red-600/30 mr-1"><i class="fa-solid fa-ban"></i></button><button onclick="unbanUser('+u.id+')" class="btn-sm bg-green-600/20 text-green-400 hover:bg-green-600/30 mr-1"><i class="fa-solid fa-check"></i></button><button onclick="deleteUser('+u.id+')" class="btn-sm bg-gray-600/20 text-gray-400 hover:bg-gray-600/30"><i class="fa-solid fa-trash"></i></button></td></tr>').join('');
  const totalPages = Math.ceil(users.length / perPage);
  document.getElementById('userPagination').innerHTML = 'Halaman ' + page + ' dari ' + totalPages + ' (' + users.length + ' total)';
}

function filterUsers() {
  const q = document.getElementById('userSearch').value.toLowerCase();
  const filtered = (window._allUsers||[]).filter(u => (u.name||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
  renderUsers(filtered);
}

        <div><label class="block text-xs text-gray-400 mb-1">Model</label><input id="byokModel" class="input rounded-lg w-full px-3 py-2 text-sm" placeholder="gpt-3.5-turbo"></div>
        <div><label class="block text-xs text-gray-400 mb-1">API Key</label><input id="byokKey" type="password" class="input rounded-lg w-full px-3 py-2 text-sm"></div>
      </div>
      <div class="flex gap-2 mb-4">
        <button onclick="byokFetchModels()" class="btn bg-blue-600 hover:bg-blue-700 text-white text-sm"><i class="fa-solid fa-list mr-1"></i>Fetch Models</button>
        <button onclick="byokTestChat()" class="btn bg-purple-600 hover:bg-purple-700 text-white text-sm"><i class="fa-solid fa-play mr-1"></i>Test Chat</button>
      </div>
      <div><label class="block text-xs text-gray-400 mb-1">Response</label><pre id="byokResponse" class="input rounded-lg w-full p-3 text-sm font-mono whitespace-pre-wrap overflow-auto max-h-60" style="min-height:120px">—</pre></div>
    </div>
  `;
  document.getElementById('byokProvider').addEventListener('change', function() {
    document.getElementById('byokBaseUrlDiv').classList.toggle('hidden', this.value !== 'openai-compatible');
  });
}

async function byokFetchModels() {
  const provider = document.getElementById('byokProvider').value;
  const baseUrl = document.getElementById('byokBaseUrl').value;
  const key = document.getElementById('byokKey').value;
  if (!key) { toast('API Key wajib diisi', 'error'); return; }
  const res = await api('/api/byok/models', { method:'POST', body:JSON.stringify({ provider, api_key:key, base_url:baseUrl }) });
  if (res && res.status < 400) {
    document.getElementById('byokResponse').textContent = JSON.stringify(res.data, null, 2);
  } else {
    document.getElementById('byokResponse').textContent = res?.data ? JSON.stringify(res.data, null, 2) : 'Error';
  }
}

async function byokTestChat() {
  const provider = document.getElementById('byokProvider').value;
  const baseUrl = document.getElementById('byokBaseUrl').value;
  const key = document.getElementById('byokKey').value;
  const model = document.getElementById('byokModel').value;
  if (!key || !model) { toast('API Key dan Model wajib diisi', 'error'); return; }
  const res = await api('/api/byok/'+provider+'/chat', { method:'POST', body:JSON.stringify({ api_key:key, base_url:baseUrl, model, messages:'Hello!' }) });
  document.getElementById('byokResponse').textContent = res ? JSON.stringify(res.data, null, 2) : 'No response';
  toast('Response diterima');
}

// ─── Init ───
window.addEventListener('DOMContentLoaded', () => {
  if (!TOKEN && window.location.pathname !== '/admin/login') {
    window.location.href = '/admin/login';
    return;
  }
  showPage(getPage());
});

window.addEventListener('popstate', () => showPage(getPage()));

// Override link clicks for client-side routing
document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a || !a.getAttribute('href')?.startsWith('/admin/')) return;
  if (a.getAttribute('href') === '/admin/login' || a.getAttribute('onclick')) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  window.history.pushState({}, '', href);
  showPage(getPage());
});
</script>
</body>
