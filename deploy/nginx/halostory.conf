# HaloStory Backend — Nginx Reverse Proxy
# Lokasi di VPS: /etc/nginx/sites-available/halostory
# Domain: backend-hsai.rafiq8k.my.id
# App Go: 127.0.0.1:3000 (docker-compose ports ${APP_HOST_PORT:-3000}:3000)
# SSL: jangan tulis manual — biarkan `certbot --nginx` yang generate block :443

# Rate limit zones — anti brute-force
limit_req_zone $binary_remote_addr zone=halostory_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=halostory_otp:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=halostory_general:10m rate=60r/s;

# Upstream — keepalive 32 reuse koneksi ke Go
upstream halostory_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name backend-hsai.rafiq8k.my.id;

    # Upload: chat 5 MB + admin upload + backup terenkripsi
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Gzip untuk JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_comp_level 4;

    # Logging
    access_log /var/log/nginx/halostory_access.log;
    error_log /var/log/nginx/halostory_error.log warn;

    # Certbot webroot — wajib di atas `location /` agar tidak ke-proxy
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Exact matches (rate limit ketat) ---

    location = /api/login {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/register {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/forgot-password {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/email/send-verification-otp {
        limit_req zone=halostory_otp burst=3 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    # --- Regex locations ---

    # SSE streaming — wajib tanpa buffering, timeout panjang
    location ~ ^/api/chat/stream/ {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Image proxy S3 — cache di edge 1 hari
    location ~ ^/api/image {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # --- General proxy (prefix, dievaluasi terakhir) ---
    location / {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
    }
}
