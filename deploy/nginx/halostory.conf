# HaloStory Backend — Nginx Reverse Proxy + SSL
# Lokasi di VPS: /etc/nginx/sites-available/halostory
# Domain: backend-hsai.rafiq8k.my.id
# App Go: 127.0.0.1:3000 (docker-compose ports ${APP_HOST_PORT:-3000}:3000)

# Rate limit zones — anti brute-force
limit_req_zone $binary_remote_addr zone=halostory_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=halostory_otp:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=halostory_general:10m rate=60r/s;

# Upstream — keepalive 32 reuse koneksi ke Go
upstream halostory_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP — redirect ke HTTPS + ACME challenge untuk Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name backend-hsai.rafiq8k.my.id;

    # Certbot webroot — jangan di-redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend-hsai.rafiq8k.my.id;

    # SSL — diisi otomatis oleh `certbot --nginx -d backend-hsai.rafiq8k.my.id`
    # Jika pakai `certonly --webroot`, uncomment manual:
    # ssl_certificate /etc/letsencrypt/live/backend-hsai.rafiq8k.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/backend-hsai.rafiq8k.my.id/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Upload: chat 5 MB + admin upload + backup terenkripsi
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Gzip untuk JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_comp_level 4;

    # Logging
    access_log /var/log/nginx/halostory_access.log;
    error_log /var/log/nginx/halostory_error.log warn;

    # --- Exact matches (dievaluasi pertama, taruh di atas) ---

    # Login / register / forgot-password — rate limit ketat
    location = /api/login {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/register {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/forgot-password {
        limit_req zone=halostory_login burst=5 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location = /api/email/send-verification-otp {
        limit_req zone=halostory_otp burst=3 nodelay;
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    # --- Regex locations ---

    # SSE streaming — wajib tanpa buffering, timeout panjang
    location ~ ^/api/chat/stream/ {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Image proxy S3 — cache di edge 1 hari
    location ~ ^/api/image {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # --- General proxy (prefix, dievaluasi terakhir) ---
    location / {
        proxy_pass http://halostory_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 16k;
    }
}
